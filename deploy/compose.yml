services:
  pwa:
    build: ..
    image: wally-pwa:0.1.0
    restart: unless-stopped
    env_file: /opt/wally-assistant/pwa.env
    ports: ["127.0.0.1:3103:3000"]
    volumes: ["/opt/wally-assistant/pwa-data:/data"]
    networks: [assistant]
    mem_limit: 384m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  hermes:
    image: ${HERMES_IMAGE:?Set the reviewed official image digest}
    profiles: [runtime]
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file: /opt/wally-assistant/hermes.env
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
    volumes: ["/opt/wally-assistant/hermes-data:/opt/data"]
    networks: [assistant]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  assistant:
    name: wally-assistant
